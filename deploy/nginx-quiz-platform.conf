server {
    server_name practicesat.duckdns.org;

    root /var/www/quiz-platform/current;
    include /etc/nginx/snippets/quiz-security-headers.conf;
    # Keep URL paths, query strings, bearer/cookie headers and bodies out of access logs.
    access_log /var/log/nginx/quiz-access.log quiz_redacted;
    if (-f /var/www/quiz-platform/maintenance) { return 503; }
    error_page 503 =503 @maintenance;
    location @maintenance { default_type text/plain; return 503 "Service maintenance. Please retry shortly.\n"; }
    index index.html;

    client_max_body_size 10m;

    # The release activation gate reports schema readiness and the running release identity.
    # It is reached only over the loopback port the host publishes, never through this proxy.
    location = /api/health/release {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO presigned URLs are same-origin under /storage/ so the browser
    # doesn't block them as mixed content once the page is served over
    # HTTPS. forcePathStyle in the API's S3 client already puts the bucket
    # in the path, so stripping this prefix hands MinIO exactly what it
    # expects (/<bucket>/<key>).
    #
    # The signature covers the host and path the URL was signed for: the API
    # signs for S3_ENDPOINT (http://minio:9000, no /storage/ prefix) and hands
    # the URL out under S3_PUBLIC_ENDPOINT. MinIO must see that signed host,
    # not this site's, or every upload fails with SignatureDoesNotMatch.
    location /storage/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition "attachment" always;
        include /etc/nginx/snippets/quiz-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/quiz-security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/practicesat.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/practicesat.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = practicesat.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name practicesat.duckdns.org;
    return 404; # managed by Certbot


}