server {
    listen 80;
    listen [::]:80;
    server_name practicesat.duckdns.org;

    root /var/www/quiz-platform;
    index index.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO presigned URLs are same-origin under /storage/ so the browser
    # doesn't block them as mixed content once the page is served over
    # HTTPS. forcePathStyle in the API's S3 client already puts the bucket
    # in the path, so stripping this prefix hands MinIO exactly what it
    # expects (/<bucket>/<key>).
    location /storage/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
    }

    location / {
        try_files $uri /index.html;
    }
}
