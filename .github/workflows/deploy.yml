name: Validate and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auth-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: isolated-auth-tests
          POSTGRES_DB: quiz_auth_test
        # Below 32768 on purpose: Linux lends 32768-60999 to outgoing connections, so a host port
        # in that range intermittently fails to bind ("address already in use") after the pull.
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_test -d quiz_auth_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://auth_test:isolated-auth-tests@127.0.0.1:15432/quiz_auth_test
      # test/test-env.ts reads this rather than DATABASE_URL; its default is the local 55432 setup.
      AUTH_TEST_DATABASE_URL: postgresql://auth_test:isolated-auth-tests@127.0.0.1:15432/quiz_auth_test
      VITE_AUTH_GOOGLE_ENABLED: ${{ vars.AUTH_GOOGLE_ENABLED || 'false' }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker run -d --name quiz-auth-test-minio -e MINIO_ROOT_USER=auth_test_storage -e MINIO_ROOT_PASSWORD=isolated-auth-test-storage -p 127.0.0.1:59000:9000 --tmpfs /data quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - run: pnpm --filter @quiz-platform/shared build && pnpm --filter @quiz-platform/shared build:cjs
      - run: pnpm --filter @quiz-platform/api exec prisma generate && pnpm --filter @quiz-platform/api exec prisma validate
      - run: pnpm --filter @quiz-platform/api exec prisma migrate deploy
      - run: pnpm --filter @quiz-platform/api build && pnpm --filter @quiz-platform/web build
      - run: pnpm --filter @quiz-platform/api exec jest --runInBand
      - run: pnpm --filter @quiz-platform/api exec jest --config test/jest-e2e.json --runInBand
      - run: pnpm --filter @quiz-platform/api exec eslint "{src,apps,libs,test}/**/*.ts"
      - run: pnpm --filter @quiz-platform/web lint
      - run: pnpm --filter @quiz-platform/api exec playwright install --with-deps chromium firefox
      - run: pnpm --filter @quiz-platform/api test:auth:browser
      # The final runtime image is built and started here, before anything is published. A
      # successful source build is not evidence that the image runs: the packaged Prisma
      # client was previously absent, so the image built and then failed at container start.
      - name: Build the final runtime image
        run: docker build -f apps/api/Dockerfile --target runtime -t quiz-api:${{ github.sha }} .
      - name: Build the operations image
        run: docker build -f apps/api/Dockerfile --target operations -t quiz-ops:${{ github.sha }} .
      - name: Start the runtime image and run an auth smoke flow
        run: node apps/api/scripts/verify-runtime-image.mjs quiz-api:${{ github.sha }} --database-url "$DATABASE_URL"
      - name: Check the build context for secrets
        run: node apps/api/scripts/check-image-secrets.mjs quiz-api:${{ github.sha }}
      - name: Record the tested image digest
        run: |
          mkdir -p release-manifest
          {
            printf 'commit=%s\n' "${{ github.sha }}"
            printf 'runtime_image_id=%s\n' "$(docker image inspect quiz-api:${{ github.sha }} --format '{{.Id}}')"
            printf 'operations_image_id=%s\n' "$(docker image inspect quiz-ops:${{ github.sha }} --format '{{.Id}}')"
            printf 'spa_sha256=%s\n' "$(cd apps/web/dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
            printf 'schema_contract=%s\n' "$(cat deploy/auth-contract-v1)"
            printf 'google_enabled=%s\n' "${VITE_AUTH_GOOGLE_ENABLED}"
            printf 'google_client_id=%s\n' "${VITE_GOOGLE_CLIENT_ID}"
          } > release-manifest/release-manifest.txt
          cat release-manifest/release-manifest.txt
      - name: Immutable same-commit bundle
        run: |
          git archive HEAD -o release.tar
          tar -rf release.tar apps/web/dist release-manifest
          gzip release.tar
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
  deploy:
    # Every push to main that passes validate deploys automatically. workflow_dispatch is kept
    # only so a release can be re-run by hand (e.g. after fixing a droplet-side issue) without
    # needing an empty commit.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
      - name: Configure pinned SSH host identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Activate reviewed API and SPA pair under maintenance
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          scp -i ~/.ssh/deploy_key release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/quiz-platform/release-$RELEASE_ID.tar.gz"
          # `mkdir -p`, because release.sh is written to be retried: a run that stops at one of
          # its gates -- a manifest mismatch, a readiness failure -- leaves the
          # unpacked directory behind, and a bare mkdir would then fail the retry before the
          # script could run. The archive is the same immutable bundle and release.sh re-checks
          # the manifest commit and SPA hash, so re-extracting over it installs nothing new.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/quiz-platform/releases/$RELEASE_ID && tar -xzf /opt/quiz-platform/release-$RELEASE_ID.tar.gz -C /opt/quiz-platform/releases/$RELEASE_ID && bash /opt/quiz-platform/releases/$RELEASE_ID/deploy/release.sh $RELEASE_ID"
